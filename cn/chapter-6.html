<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="通过工作日比例带和所得来源条，按境内外服务日分配跨境劳务报酬。" />
    <title>跨境劳务报酬分配 | 国际税收教学资源</title>
    <link rel="stylesheet" href="../assets/css/style.css" />
    <link rel="stylesheet" href="../assets/css/learning.css" />
    <link rel="stylesheet" href="../assets/css/simulator.css" />
    <link rel="stylesheet" href="../assets/css/chapter-6.css" />
    <link rel="stylesheet" href="../assets/css/bilingual.css" />
    <link rel="stylesheet" href="../assets/css/pixel.css" />
    <link rel="stylesheet" href="../assets/css/pixel-transactions.css" />
    <script defer src="../assets/js/pixel.js"></script>
    <script defer src="../assets/js/pixel-transactions.js"></script>
    <script defer src="../assets/js/catalog.js"></script>
    <script defer src="../assets/js/catalog-view.js"></script>
    <script defer src="chapter-6.js"></script>
    <script defer src="../assets/js/learning.js"></script>
    <link rel="icon" type="image/svg+xml" href="../assets/images/coin.svg" />
  </head>
  <body class="learning simulator-page chapter-6" data-tool-id="labor">
    <header class="site-header">
      <a class="brand" href="index.html">国际税收 <span>International Taxation</span></a>
      <nav class="nav-links" aria-label="网站导航">
        <a href="index.html">首页</a>
        <a href="index.html#chapters">模拟器目录</a>
        <a class="language-switch" href="../en/chapter-6.html" lang="en" hreflang="en" aria-label="切换为英文">English</a>
      </nav>
    </header>
    <main class="page-wrap">
      <section class="chapter-hero">
        <div>
          <p class="eyebrow">综合应用 / 教材第六章</p>
          <h1>跨境劳务报酬分配</h1>
        </div>
        <div class="pixel-scene" data-pixel-scene="labor" data-label-person="跨境工作者" data-label-place-a="本国" data-label-place-b="境外" data-label-amount="劳务报酬" role="img" aria-label="跨境工作者在本国与境外提供劳务并取得报酬"></div>
      </section>

      <nav class="tool-context" data-tool-context aria-label="相关基础"></nav>
      <button class="parameter-toggle button" type="button" aria-expanded="false" aria-controls="scenario">调整参数 <span aria-hidden="true">＋</span></button>

      <div class="workspace">
        <form class="panel parameter-panel" id="scenario" novalidate>
          <section id="controlsWork" aria-labelledby="work-controls-title">
            <p class="eyebrow">年度服务</p>
            <h2 id="work-controls-title">报酬与工作日</h2>
            <div class="field">
              <label for="salary">报酬总额（元）</label>
              <input id="salary" type="number" min="0" step="1000" value="480000" required />
            </div>
            <div class="field">
              <label for="totalDays">全部服务日 <output id="totalDaysOut" for="totalDays">240 天</output></label>
              <input id="totalDays" type="range" min="1" max="365" step="1" value="240" />
            </div>
            <div class="field">
              <label for="domesticDays">本国服务日 <output id="domesticDaysOut" for="domesticDays">90 天</output></label>
              <input id="domesticDays" type="range" min="0" max="240" step="1" value="90" />
            </div>
            <p class="input-help">“本国”随所适用的来源地规则而变；其余服务日计入境外。</p>
          </section>
          <p id="form-error" class="sim-error" role="alert" hidden></p>
          <div class="reset-row"><button class="button" type="reset">重置参数 ↺</button></div>
        </form>

        <div class="results-column">
          <section class="panel result-panel" id="workPanel" aria-labelledby="work-title">
            <div class="section-heading"><div><p class="eyebrow">WORKDAY ALLOCATION</p><h2 id="work-title">服务日在哪里，报酬就分配到那里</h2></div></div>
            <div class="sim-metrics work-metrics">
              <div class="sim-metric"><span>本国来源报酬</span><strong id="domesticIncome">—</strong></div>
              <div class="sim-metric"><span>境外来源报酬</span><strong id="foreignIncome">—</strong></div>
              <div class="sim-metric"><span>境外来源比例</span><strong id="foreignPct">—</strong></div>
            </div>
            <section class="visual-section" aria-labelledby="calendar-title">
              <div class="section-heading"><h3 id="calendar-title">工作日比例带</h3><p id="calendar-summary">—</p></div>
              <div id="calendar-band" class="calendar-band" role="img" aria-label="本国与境外工作日比例"></div>
              <div class="calendar-key"><span><i class="domestic-key"></i>本国服务</span><span><i class="foreign-key"></i>境外服务</span></div>
            </section>
            <section class="visual-section" aria-labelledby="work-source-title">
              <div class="section-heading"><h3 id="work-source-title">报酬来源条</h3><p>总额 × 各地工作日 ÷ 全部工作日</p></div>
              <div id="work-source-bar" class="work-source-bar" role="img" aria-label="本国与境外来源报酬比例"><span id="domesticBar" class="domestic-part"></span><span id="foreignBar" class="foreign-part"></span></div>
              <div id="work-source-labels" class="work-source-labels"></div>
              <p id="workFormula" class="sim-formula"></p>
            </section>
            <p class="sim-note">这里只分配来源。最终纳税还要分别判断居民身份、来源国国内法、协定短期受雇规则和居民国抵免。</p>
            <p class="chapter-next"><a href="chapter-1.html">继续用乔丹案例计算抵免 →</a></p>
          </section>
        </div>
      </div>
      <nav class="sequence-nav" data-sequence-nav aria-label="学习顺序"></nav>
    </main>
  </body>
</html>
